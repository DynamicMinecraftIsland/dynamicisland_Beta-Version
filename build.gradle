plugins {
	id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// Плоская раскладка: все файлы лежат в корне репозитория, папки не нужны.
sourceSets {
	main {
		java {
			srcDirs = ['.']
			include '*.java'
		}
		resources {
			srcDirs = []
		}
	}
}

// Minecraft 26.x не обфусцирован -> блок mappings не нужен.
dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version
	from('fabric.mod.json')
	from('en_us.json') { into 'assets/dynamicisland/lang' }
	from('ru_ru.json') { into 'assets/dynamicisland/lang' }
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Заглушки Mod Menu нужны только для компиляции, в мод их класть нельзя.
jar {
	exclude 'com/terraformersmc/**'
}
